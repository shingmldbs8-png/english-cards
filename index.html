<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 영어</title>
<meta name="theme-color" content="#3C3489">
<meta name="description" content="매일 영어 표현과 단어를 받고, 지난 카드를 날짜별·주제별로 다시 보는 앱">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 영어">
<style>
:root{
  --bg:#F7F6F2; --surface:#FFFFFF; --surface2:#F1EFE8; --text:#26251F; --text2:#5F5E5A; --muted:#888780;
  --border:#E2E0D8; --accent:#534AB7; --accent-bg:#EEEDFE; --accent-text:#3C3489;
  --star:#BA7517; --ok:#3B6D11; --ok-bg:#EAF3DE;
  --c-small:#0F6E56; --c-small-bg:#E1F5EE;
  --c-daily:#993C1D; --c-daily-bg:#FAECE7;
  --c-biz:#185FA5; --c-biz-bg:#E6F1FB;
  --c-grammar:#993556; --c-grammar-bg:#FBEAF0;
  --c-word:#3C3489; --c-word-bg:#EEEDFE;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1A1A18; --surface:#252522; --surface2:#2F2F2B; --text:#EDEBE3; --text2:#B4B2A9; --muted:#888780;
    --border:#3A3A35; --accent:#AFA9EC; --accent-bg:#2E2A57; --accent-text:#CECBF6;
    --star:#EF9F27; --ok:#97C459; --ok-bg:#24331A;
    --c-small:#5DCAA5; --c-small-bg:#10302A;
    --c-daily:#F0997B; --c-daily-bg:#3A2219;
    --c-biz:#85B7EB; --c-biz-bg:#142A42;
    --c-grammar:#ED93B1; --c-grammar-bg:#3A1C29;
    --c-word:#AFA9EC; --c-word-bg:#2A2650;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header.top{padding:calc(12px + env(safe-area-inset-top)) 16px 4px;max-width:560px;margin:0 auto}
header.top h1{font-size:22px;margin:0;font-weight:700}
header.top p{margin:4px 0 0;color:var(--text2);font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 18px 16px;margin:0 0 14px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.b-small{color:var(--c-small);background:var(--c-small-bg)}
.b-daily{color:var(--c-daily);background:var(--c-daily-bg)}
.b-biz{color:var(--c-biz);background:var(--c-biz-bg)}
.b-grammar{color:var(--c-grammar);background:var(--c-grammar-bg)}
.b-word{color:var(--c-word);background:var(--c-word-bg)}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.meta{font-size:12px;color:var(--muted)}
.en{font-size:24px;line-height:1.3;margin:14px 0 6px;font-weight:700;letter-spacing:-.01em}
.pos{font-size:13px;color:var(--muted);font-weight:400;margin-left:6px}
.ko{font-size:17px;color:var(--text2);margin:0 0 14px;line-height:1.5}
.ex{background:var(--surface2);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.ex div{flex:1}
.ex-en{margin:0;font-size:16px;line-height:1.5}
.ex-ko{margin:4px 0 0;font-size:14px;color:var(--text2);line-height:1.5}
.tip{font-size:14px;color:var(--text2);margin:12px 0 0;line-height:1.5}
.tip b{color:var(--text)}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:active{transform:scale(.97)}
.btn.on-star{color:var(--star);border-color:var(--star)}
.btn.on-known{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.icon-btn{border:none;background:transparent;padding:6px;border-radius:8px;color:var(--text2);min-width:36px;min-height:36px}
svg.i{width:18px;height:18px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.done-box{text-align:center;color:var(--text2);font-size:14px;padding:8px 0 4px}
/* 기록 */
.search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);font-size:16px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;margin:12px 0}
.seg button{flex:1;border:none;background:transparent;padding:9px;border-radius:9px;font-size:14px;color:var(--text2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent);font-weight:600}
.row-opt{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--text2);margin:2px 0 10px}
.row-opt label{display:flex;align-items:center;gap:6px}
.day{margin:18px 0 8px;font-size:14px;font-weight:700;color:var(--text2)}
.item{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin:0 0 8px}
.item-head{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item-en{font-weight:700;font-size:17px;margin:8px 0 2px}
.item-ko{color:var(--text2);font-size:15px}
.hide-ko .item:not(.open) .item-ko{filter:blur(6px);user-select:none}
.item .more{display:none;margin-top:10px}
.item.open .more{display:block}
.item-click{cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:15px;line-height:1.6}
.count{font-size:13px;color:var(--muted);margin:0 0 6px}
/* 설정 */
.set{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:4px 16px;margin:0 0 14px}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border);gap:12px}
.set-row:last-child{border-bottom:none}
.set-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.set select{padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px;width:100%}
.bar i{display:block;height:100%;background:var(--accent)}
.prog{padding:12px 0;border-bottom:1px solid var(--border)}
.prog:last-child{border-bottom:none}
.prog-top{display:flex;justify-content:space-between;font-size:14px}
.danger{color:#C0392B}
h2.sec{font-size:15px;margin:22px 4px 8px;color:var(--text2)}
/* 하단 탭 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:none;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg.i{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:.95}
/* 대화 */
.target{background:var(--accent-bg);color:var(--accent-text);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.target b{display:block;font-size:17px}
.msgs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:88%;padding:10px 14px;border-radius:16px;line-height:1.5;font-size:16px}
.bub.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.fb{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:14px;color:var(--text2);white-space:pre-line}
.typing{color:var(--muted);font-size:14px}
.composer{display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0}
.composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:16px}
.err{color:#C0392B;font-size:14px;margin:4px 0 8px}
.keyinput{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);margin-top:8px}
[hidden]{display:none !important}
</style>
</head>
<body>
<header class="top">
  <h1 id="title">오늘의 영어</h1>
  <p id="subtitle"></p>
</header>

<main class="wrap">
  <section id="view-today"></section>

  <section id="view-archive" hidden>
    <input id="q" class="search" type="search" placeholder="받은 카드에서 검색 (영어·한국어)" autocomplete="off">
    <div class="seg" role="group" aria-label="보기 방식">
      <button type="button" data-mode="date" aria-pressed="true">날짜별</button>
      <button type="button" data-mode="topic" aria-pressed="false">주제별</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="row-opt">
      <span id="arch-count"></span>
      <label><input type="checkbox" id="hideKo"> 뜻 가리기</label>
    </div>
    <div id="arch-list"></div>
  </section>

  <section id="view-settings" hidden></section>

  <section id="view-chat" hidden></section>
</main>

<nav class="tabs" aria-label="메뉴">
  <div class="in">
    <button type="button" data-tab="today" aria-current="page"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>오늘</button>
    <button type="button" data-tab="archive"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>기록</button>
    <button type="button" data-tab="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>설정</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
